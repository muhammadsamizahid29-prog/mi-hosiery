<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>MI Hosiery — Accounting Suite</title>
<meta name="theme-color" content="#0B0B0E">
<meta name="description" content="Accounting suite for MI Hosiery — Owner: Muhammad Zahid">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MI Hosiery">
<meta name="application-name" content="MI Hosiery">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Naskh+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B0B0E;--card:#16161D;--card-2:#131319;--border:#262630;--text:#F7F7FA;--muted:#9CA3AF;
  --blue:#3B82F6;--emerald:#10B981;--yellow:#FBBF24;--rose:#F43F5E;--violet:#8B5CF6;--radius:18px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden;padding-bottom:40px}
body::before{content:'';position:fixed;inset:0;z-index:-2;pointer-events:none;
  background:radial-gradient(700px 460px at 8% -8%,rgba(59,130,246,.20),transparent 62%),
  radial-gradient(560px 420px at 98% 2%,rgba(16,185,129,.15),transparent 62%),
  radial-gradient(720px 520px at 50% 112%,rgba(251,191,36,.10),transparent 62%),
  radial-gradient(500px 400px at 88% 78%,rgba(139,92,246,.10),transparent 62%)}
body::after{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.35;
  background-image:radial-gradient(rgba(255,255,255,.045) 1px,transparent 1px);background-size:26px 26px;
  mask-image:radial-gradient(circle at 50% 0%,#000 0%,transparent 78%);
  -webkit-mask-image:radial-gradient(circle at 50% 0%,#000 0%,transparent 78%)}
body.urdu{font-family:'Noto Naskh Arabic','Inter',sans-serif}
.wrap{max-width:1120px;margin:0 auto;padding:18px 16px 0}
.top{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 16px;margin-bottom:16px;
  background:linear-gradient(180deg,rgba(22,22,29,.92),rgba(19,19,25,.72));border:1px solid var(--border);
  border-radius:var(--radius);backdrop-filter:blur(14px);box-shadow:0 18px 40px -22px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,255,255,.04)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:46px;height:46px;flex:0 0 auto;border-radius:14px;display:grid;place-items:center;font-weight:800;font-size:15px;letter-spacing:.5px;color:#fff;
  background:linear-gradient(145deg,#1D4ED8,#3B82F6 55%,#22D3EE);
  box-shadow:0 8px 22px -8px rgba(59,130,246,.9),inset 0 1px 0 rgba(255,255,255,.35)}
.brand h1{font-size:17px;font-weight:800;letter-spacing:.2px;line-height:1.15;white-space:nowrap}
.brand p{font-size:11.5px;color:var(--muted);margin-top:3px;letter-spacing:.3px}
.brand p b{color:#D1D5DB;font-weight:600}
.lang-switch{display:flex;flex:0 0 auto;padding:4px;gap:4px;border-radius:12px;background:#101016;border:1px solid var(--border)}
.lang-switch button{border:0;background:transparent;color:var(--muted);font:600 12.5px/1 'Inter',sans-serif;padding:9px 13px;border-radius:9px;cursor:pointer;transition:.22s ease}
.lang-switch button:hover{color:#fff}
.lang-switch button.on{color:#0B0B0E;background:linear-gradient(145deg,#FFFFFF,#D9DEE7);box-shadow:0 6px 16px -8px rgba(255,255,255,.6)}
.lang-switch button.ur{font-family:'Noto Naskh Arabic',sans-serif;font-size:14px}
.equation{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;padding:13px 16px;margin-bottom:16px;
  background:linear-gradient(90deg,rgba(59,130,246,.10),rgba(16,185,129,.10),rgba(251,191,36,.10));
  border:1px solid var(--border);border-radius:var(--radius);font-size:13px;font-weight:600;letter-spacing:.2px}
.eq-item{color:#E5E7EB;text-align:center}
.eq-item span{display:block;font-size:10.5px;color:var(--muted);font-weight:500;margin-top:2px;letter-spacing:.4px;text-transform:uppercase}
.eq-op{color:var(--muted);font-size:16px;font-weight:700}
.eq-ok{color:var(--emerald);font-size:11.5px;font-weight:700;letter-spacing:.5px}
.sec-title{display:flex;align-items:center;justify-content:space-between;margin:22px 2px 11px}
.sec-title h2{font-size:13px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:#E5E7EB}
.sec-title small{font-size:11px;color:var(--muted);letter-spacing:.4px}
.scroller{display:flex;gap:12px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none;-ms-overflow-style:none;scroll-snap-type:x proximity}
.scroller::-webkit-scrollbar{display:none}
.feat{flex:0 0 auto;min-width:206px;scroll-snap-align:start;border-radius:var(--radius);padding:15px 16px 16px;position:relative;overflow:hidden;
  color:#fff;cursor:pointer;transition:transform .18s cubic-bezier(.2,.8,.3,1),box-shadow .18s ease;border:1px solid rgba(255,255,255,.14);text-align:inherit}
.feat:active{transform:scale(.965)}
.feat:hover{transform:translateY(-2px)}
.feat .glow{position:absolute;width:130px;height:130px;border-radius:50%;right:-42px;top:-52px;background:rgba(255,255,255,.28);filter:blur(26px);pointer-events:none}
.feat .ring{position:absolute;inset:auto -30px -60px auto;width:150px;height:150px;border-radius:50%;border:1px solid rgba(255,255,255,.22);pointer-events:none}
.feat-top{display:flex;align-items:center;gap:8px;margin-bottom:16px;position:relative}
.feat-ico{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:rgba(255,255,255,.22);font-size:13px;backdrop-filter:blur(6px)}
.feat-label{font-size:10.5px;font-weight:800;letter-spacing:1.3px;text-transform:uppercase;opacity:.94}
.feat-val{font-size:19px;font-weight:800;letter-spacing:-.3px;position:relative}
.feat-sub{font-size:11px;opacity:.85;margin-top:5px;position:relative;font-weight:500}
.feat.blue{background:linear-gradient(145deg,#1E40AF,#3B82F6 58%,#60A5FA);box-shadow:0 16px 34px -18px rgba(59,130,246,1)}
.feat.emerald{background:linear-gradient(145deg,#047857,#10B981 58%,#34D399);box-shadow:0 16px 34px -18px rgba(16,185,129,1)}
.feat.yellow{background:linear-gradient(145deg,#B45309,#F59E0B 58%,#FBBF24);box-shadow:0 16px 34px -18px rgba(251,191,36,1)}
.feat.violet{background:linear-gradient(145deg,#5B21B6,#8B5CF6 58%,#A78BFA);box-shadow:0 16px 34px -18px rgba(139,92,246,1)}
.feat.rose{background:linear-gradient(145deg,#9F1239,#F43F5E 58%,#FB7185);box-shadow:0 16px 34px -18px rgba(244,63,94,1)}
.card{background:linear-gradient(180deg,var(--card),var(--card-2));border:1px solid var(--border);border-radius:var(--radius);padding:16px;
  box-shadow:0 18px 40px -28px rgba(0,0,0,1),inset 0 1px 0 rgba(255,255,255,.035)}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.kpi{padding:14px;position:relative;overflow:hidden}
.kpi::after{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:3px;opacity:.9}
.kpi.asset::after{background:var(--blue)}.kpi.liability::after{background:var(--rose)}
.kpi.equity::after{background:var(--yellow)}.kpi.revenue::after{background:var(--emerald)}
.kpi.expense::after{background:#FB923C}.kpi.profit::after{background:var(--violet)}
.kpi .k-label{font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);font-weight:700}
.kpi .k-val{font-size:17px;font-weight:800;margin-top:8px;letter-spacing:-.4px}
@media(max-width:960px){.kpis{grid-template-columns:repeat(3,1fr)}}
@media(max-width:560px){.kpis{grid-template-columns:repeat(2,1fr)}.kpi .k-val{font-size:15px}}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin-top:22px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1px solid var(--border);background:#111117;color:var(--muted);padding:9px 15px;border-radius:12px;
  font:600 12.5px/1 'Inter',sans-serif;cursor:pointer;transition:.2s ease;white-space:nowrap}
.tab:hover{color:#E5E7EB;border-color:#33333f}
.tab.on{color:#fff;border-color:rgba(59,130,246,.55);background:linear-gradient(145deg,rgba(59,130,246,.24),rgba(59,130,246,.08));
  box-shadow:0 8px 22px -14px rgba(59,130,246,1),inset 0 1px 0 rgba(255,255,255,.08)}
.panel{animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:820px){.grid2{grid-template-columns:1fr}}
h3.block-h{font-size:12px;letter-spacing:1.3px;text-transform:uppercase;color:#E5E7EB;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
h3.block-h::before{content:'';width:6px;height:6px;border-radius:2px;background:var(--blue);box-shadow:0 0 10px var(--blue)}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:360px}
table.tbl th{text-align:left;font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);font-weight:700;padding:9px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
table.tbl td{padding:11px 10px;border-bottom:1px solid rgba(38,38,48,.65);color:#D1D5DB;vertical-align:middle}
table.tbl tr:last-child td{border-bottom:0}
table.tbl tr:hover td{background:rgba(255,255,255,.018)}
table.tbl .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.tbl tfoot td{font-weight:800;color:#fff;border-top:1px solid var(--border);border-bottom:0;background:rgba(255,255,255,.025);padding:13px 10px}
body[dir="rtl"] table.tbl th,body[dir="rtl"] table.tbl td{text-align:right}
body[dir="rtl"] table.tbl .num{text-align:left}
.pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
.pill.asset{background:rgba(59,130,246,.16);color:#93C5FD;border:1px solid rgba(59,130,246,.3)}
.pill.liability{background:rgba(244,63,94,.16);color:#FDA4AF;border:1px solid rgba(244,63,94,.3)}
.pill.equity{background:rgba(251,191,36,.16);color:#FCD34D;border:1px solid rgba(251,191,36,.3)}
.pill.revenue{background:rgba(16,185,129,.16);color:#6EE7B7;border:1px solid rgba(16,185,129,.3)}
.pill.expense{background:rgba(251,146,60,.16);color:#FDBA74;border:1px solid rgba(251,146,60,.3)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);font-weight:700}
input,select,textarea{width:100%;background:#0F0F15;border:1px solid var(--border);border-radius:12px;color:var(--text);
  font:500 13.5px/1.4 'Inter',sans-serif;padding:11px 13px;transition:.2s ease;outline:none}
input:disabled,select:disabled{opacity:.6;cursor:not-allowed}
body.urdu input,body.urdu select{font-family:'Noto Naskh Arabic',sans-serif;font-size:15px}
input:focus,select:focus,textarea:focus{border-color:rgba(59,130,246,.65);box-shadow:0 0 0 3px rgba(59,130,246,.14);background:#111119}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,#6B7280 50%),linear-gradient(135deg,#6B7280 50%,transparent 50%);
  background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:36px}
body[dir="rtl"] select{background-position:18px 50%,13px 50%;padding-right:13px;padding-left:36px}
option{background:#16161D;color:#F7F7FA}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.row{grid-template-columns:1fr}}
button.primary{width:100%;border:0;border-radius:13px;padding:13px;cursor:pointer;font:800 13px/1 'Inter',sans-serif;letter-spacing:.6px;color:#04101F;
  background:linear-gradient(145deg,#60A5FA,#3B82F6);
  box-shadow:0 14px 30px -16px rgba(59,130,246,1),inset 0 1px 0 rgba(255,255,255,.4);transition:.18s ease}
button.primary:hover{filter:brightness(1.07)}
button.primary:active{transform:scale(.985)}
button.ghost{border:1px solid var(--border);background:#111117;color:#D1D5DB;border-radius:12px;padding:10px 14px;font:700 12px/1 'Inter',sans-serif;cursor:pointer;transition:.2s}
button.ghost:hover{border-color:#3A3A48;color:#fff}
button.danger{color:#FDA4AF;border-color:rgba(244,63,94,.35);background:rgba(244,63,94,.09)}
button.danger:hover{background:rgba(244,63,94,.18);color:#fff}
button.cancel{border:1px solid var(--border);background:transparent;color:var(--muted);border-radius:12px;padding:12px;font:700 12px/1 'Inter',sans-serif;cursor:pointer;transition:.2s;width:100%;margin-top:8px}
button.cancel:hover{color:#fff;border-color:#3A3A48}
.icon-btn{border:1px solid var(--border);background:#111117;color:var(--muted);width:32px;height:32px;border-radius:9px;cursor:pointer;display:inline-grid;place-items:center;font-size:12px;transition:.2s;margin-inline-start:4px}
.icon-btn:hover{color:#93C5FD;border-color:rgba(59,130,246,.5);background:rgba(59,130,246,.12)}
.icon-btn.del:hover{color:#FDA4AF;border-color:rgba(244,63,94,.5);background:rgba(244,63,94,.12)}
.entry{border:1px solid var(--border);border-radius:14px;padding:13px 14px;margin-bottom:10px;background:#12121A;transition:.2s}
.entry:hover{border-color:#32323f;background:#14141d}
.entry.editing{border-color:rgba(59,130,246,.55);background:rgba(59,130,246,.06)}
.entry-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.entry-desc{font-size:13.5px;font-weight:600;color:#F3F4F6;line-height:1.4;word-break:break-word}
.entry-date{font-size:10.5px;color:var(--muted);margin-top:5px;letter-spacing:.4px;font-weight:600}
.entry-lines{margin-top:11px;border-top:1px dashed rgba(38,38,48,.9);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.eline{display:flex;justify-content:space-between;font-size:12.5px;color:#B6BCC6;gap:10px}
.eline .amt{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.eline.dr .amt{color:#93C5FD}
.eline.cr .amt{color:#6EE7B7}
.eline .tag{font-size:9.5px;color:var(--muted);margin-inline-start:6px;letter-spacing:.6px}
.rule{border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:11px;background:linear-gradient(180deg,#14141C,#111117)}
.rule h4{font-size:13.5px;font-weight:800;color:#fff;margin-bottom:7px;letter-spacing:.2px}
.rule p{font-size:12.8px;line-height:1.75;color:var(--muted)}
.rule ul{margin:8px 0 0 0;padding-inline-start:18px}
.rule li{font-size:12.8px;line-height:1.8;color:var(--muted)}
.rule b{color:#E5E7EB;font-weight:700}
.rule code{background:rgba(59,130,246,.14);color:#93C5FD;padding:2px 7px;border-radius:6px;font-size:11.5px;font-weight:700}
.empty{text-align:center;padding:34px 18px;color:var(--muted);font-size:12.5px;border:1px dashed var(--border);border-radius:14px;line-height:1.8}
.empty .big{font-size:30px;display:block;margin-bottom:10px;opacity:.55}
.empty .cta{margin-top:14px}
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,26px);background:#1B1B24;border:1px solid var(--border);color:#fff;
  padding:12px 20px;border-radius:13px;font-size:12.5px;font-weight:600;box-shadow:0 24px 50px -20px #000;opacity:0;pointer-events:none;
  transition:.28s cubic-bezier(.2,.8,.3,1);z-index:999;max-width:88vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.ok{border-color:rgba(16,185,129,.5);box-shadow:0 24px 50px -20px #000,0 0 0 3px rgba(16,185,129,.12)}
#toast.err{border-color:rgba(244,63,94,.5);box-shadow:0 24px 50px -20px #000,0 0 0 3px rgba(244,63,94,.12)}
footer.foot{text-align:center;margin-top:34px;padding:20px 10px 8px;border-top:1px solid var(--border);color:#5F6673;font-size:11px;line-height:1.9;letter-spacing:.3px}
footer.foot b{color:#9CA3AF;font-weight:700}
.back-btn{display:inline-flex;align-items:center;gap:7px;margin-bottom:14px;border:1px solid var(--border);background:#111117;color:#D1D5DB;
  padding:9px 14px;border-radius:11px;font:700 12px/1 'Inter',sans-serif;cursor:pointer;transition:.2s}
.back-btn:hover{border-color:#3A3A48;color:#fff}
body[dir="rtl"] .back-btn .arrow{transform:scaleX(-1)}
.edit-badge{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;
  color:#93C5FD;background:rgba(59,130,246,.15);border:1px solid rgba(59,130,246,.35);padding:3px 8px;border-radius:6px;margin-bottom:10px}
</style>
</head>

<script>
'use strict';
var KEY = 'mi-hosiery-accounting-v2';

var DEFAULT_ACCOUNTS = [

  {id:'5060',en:'Miscellaneous Expense',  ur:'متفرق اخراجات',            type:'expense',   n:'D'}
];

var CATS = {
  asset:    {en:'Assets',         ur:'اثاثے',         color:'blue',    icon:'◈',
    descEn:'Resources owned by the business that provide future economic benefit.',
    descUr:'وہ وسائل جو کاروبار کی ملکیت ہیں اور مستقبل میں معاشی فائدہ دیں گے۔'},
  liability:{en:'Liabilities',    ur:'واجبات',        color:'rose',    icon:'▼',
    descEn:'Obligations owed to outsiders (payables, loans, taxes).',
    descUr:'وہ ذمہ داریاں جو بیرونی افراد کو ادا کرنی ہیں۔'},

    descEn:'Owner\u2019s claim on the business — capital plus retained profit.',
    descUr:'کاروبار پر مالک کا حق — سرمایہ اور محفوظ منافع۔'},
  revenue:  {en:'Revenue',        ur:'آمدنی',         color:'emerald', icon:'▲',
    descEn:'Income from selling hosiery goods — increases equity.',
    descUr:'ہوزری کی فروخت سے آمدنی — سرمایہ بڑھاتی ہے۔'},
  expense:  {en:'Expenses',       ur:'اخراجات',       color:'yellow',  icon:'●',
    descEn:'Costs incurred to run the business — decrease equity.',
    descUr:'کاروبار چلانے کے اخراجات — سرمایہ کم کرتے ہیں۔'}
};

var state = {
  lang:'en', tab:'dashboard', cat:'asset', ledgerAcc:'1000',
  accounts: [], entries: [], nextId: 1,
  editingAccount: null, editingEntry: null,
  newAccountType: null
};

function $(s){ return document.querySelector(s); }
function L(en, ur){ return state.lang === 'ur' ? ur : en; }
function esc(s){
  s = (s === null || s === undefined) ? '' : String(s);
  return s.replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; });
}
function nm(a){ return state.lang === 'ur' ? a.ur : a.en; }
function acc(id){ for(var i=0;i<state.accounts.length;i++){ if(state.accounts[i].id === id) return state.accounts[i]; } return null; }
function fmt(n){
  var v = Math.round((Number(n) || 0) * 100) / 100;
  var s = Math.abs(v).toLocaleString('en-US', {maximumFractionDigits: 2});
  return (v < 0 ? '\u2212 ' : '') + 'Rs ' + s;
}
function today(){ return new Date().toISOString().slice(0,10); }
function fmtDate(d){
  try{
    var dt = new Date(d + 'T00:00:00');
    return dt.toLocaleDateString(state.lang === 'ur' ? 'ur-PK' : 'en-GB', {day:'2-digit', month:'short', year:'numeric'});
  }catch(e){ return d; }
}

function save(){
  try{
    localStorage.setItem(KEY, JSON.stringify({
      lang: state.lang, accounts: state.accounts, entries: state.entries,
      nextId: state.nextId, ledgerAcc: state.ledgerAcc
    }));
  }catch(e){ console.warn('save error', e); }
}
function load(){
  try{
    var raw = localStorage.getItem(KEY);
    if(!raw) return false;
    var s = JSON.parse(raw);
    if(!s || !Array.isArray(s.accounts) || !Array.isArray(s.entries)) return false;
    state.accounts = s.accounts;
    state.entries  = s.entries;
    state.nextId   = s.nextId || 1;
    state.lang     = (s.lang === 'ur') ? 'ur' : 'en';
    state.ledgerAcc= s.ledgerAcc || (s.accounts[0] ? s.accounts[0].id : '1000');
    return true;
  }catch(e){ return false; }
}

function netMap(){
  var net = {};
  state.accounts.forEach(function(a){ net[a.id] = 0; });
  state.entries.forEach(function(e){
    (e.lines || []).forEach(function(l){
      net[l.accountId] = (net[l.accountId] || 0) + (Number(l.debit) || 0) - (Number(l.credit) || 0);
    });
  });
  return net;
}
var SIGN = {asset:1, expense:1, liability:-1, equity:-1, revenue:-1};
function balOf(a, net){ return (SIGN[a.type] || 1) * (net[a.id] || 0); }
function totals(){
  var net = netMap();
  var t = {asset:0, liability:0, equity:0, revenue:0, expense:0};
  state.accounts.forEach(function(a){ t[a.type] += balOf(a, net); });
  t.profit = t.revenue - t.expense;
  t.equityTotal = t.equity + t.profit;
  return t;
}

var toastTimer;
function toast(msg, type){
  var el = $('#toast');
  el.textContent = msg;
  el.className = 'show ' + (type || 'ok');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.className = ''; }, 3200);
}

function render(){
  try{
    var y = window.scrollY;
    document.documentElement.lang = state.lang;
    document.body.dir = state.lang === 'ur' ? 'rtl' : 'ltr';
    document.body.classList.toggle('urdu', state.lang === 'ur');
    var html = headerHTML() + equationHTML() + featuredHTML() + kpiHTML() + tabsHTML() + mainHTML() + footerHTML();
    $('#app').innerHTML = html;
    bind();
    save();
    window.scrollTo(0, y);
  }catch(err){
    console.error('Render error:', err);
    $('#app').innerHTML = '<div style="padding:30px;color:#F43F5E;font:600 14px Inter">Render error: '+esc(err.message)+'</div>';
  }
}

function headerHTML(){
  return '<header class="top">'+
    '<div class="brand"><div class="logo">MI</div><div>'+
      '<h1>MI Hosiery</h1><p><b>Muhammad Zahid</b> · '+L('Accounting Suite','اکاؤنٹنگ سسٹم')+'</p>'+
    '</div></div>'+
    '<div class="lang-switch">'+
      '<button data-action="setLang" data-lang="en" class="'+(state.lang==='en'?'on':'')+'">EN</button>'+
      '<button data-action="setLang" data-lang="ur" class="ur '+(state.lang==='ur'?'on':'')+'">اردو</button>'+
    '</div></header>';
}

function equationHTML(){
  var t = totals();
  var rhs = t.liability + t.equityTotal;
  var ok = Math.abs(t.asset - rhs) < 0.5;
  return '<div class="equation">'+
    '<div class="eq-item num">'+fmt(t.asset)+'<span>'+L('Assets','اثاثے')+'</span></div>'+
    '<div class="eq-op">=</div>'+
    '<div class="eq-item num">'+fmt(t.liability)+'<span>'+L('Liabilities','واجبات')+'</span></div>'+
    '<div class="eq-op">+</div>'+
    '<div class="eq-item num">'+fmt(t.equityTotal)+'<span>'+L("Owner's Equity",'مالک کا سرمایہ')+'</span></div>'+
    '<div class="eq-ok">'+(ok ? '\u2713 '+L('BALANCED','متوازن') : '\u26a0 '+L('CHECK','چیک'))+'</div>'+
  '</div>';
}

function featuredHTML(){
  var t = totals();
  var list = [['asset',t.asset],['liability',t.liability],['equity',t.equityTotal],['revenue',t.revenue],['expense',t.expense]];
  var cards = list.map(function(pair){
    var key = pair[0], val = pair[1];
    var c = CATS[key];
    var count = state.accounts.filter(function(a){ return a.type === key; }).length;
    return '<div class="feat '+c.color+'" data-action="openCat" data-cat="'+key+'" role="button" tabindex="0">'+
      '<div class="glow"></div><div class="ring"></div>'+
      '<div class="feat-top"><div class="feat-ico">'+c.icon+'</div><div class="feat-label">'+L(c.en,c.ur)+'</div></div>'+
      '<div class="feat-val num">'+fmt(val)+'</div>'+
      '<div class="feat-sub">'+count+' '+L('accounts','کھاتے')+' · '+L('Tap to open','کھولنے کے لیے دبائیں')+'</div>'+
    '</div>';
  }).join('');
  return '<div class="sec-title"><h2>'+L('Account Categories','کھاتوں کے زمرے')+'</h2><small>'+L('5 sections','5 حصے')+'</small></div>'+
    '<div class="scroller">'+cards+'</div>';
}

function kpiHTML(){
  var t = totals();
  var items = [
    ['asset',    L('Total Assets','کل اثاثے'),          fmt(t.asset)],
    ['liability',L('Total Liabilities','کل واجبات'),    fmt(t.liability)],
    ['equity',   L("Owner's Equity",'مالک کا سرمایہ'),  fmt(t.equityTotal)],
    ['revenue',  L('Total Revenue','کل آمدنی'),         fmt(t.revenue)],
    ['expense',  L('Total Expenses','کل اخراجات'),      fmt(t.expense)],
    ['profit',   L('Net Profit / Loss','خالص نفع / نقصان'), fmt(t.profit)]
  ];
  var k = items.map(function(it){
    return '<div class="card kpi '+it[0]+'"><div class="k-label">'+it[1]+'</div><div class="k-val num">'+it[2]+'</div></div>';
  }).join('');
  return '<div class="sec-title"><h2>'+L('Financial Snapshot','مالی خلاصہ')+'</h2><small>'+L('Live figures','تازہ اعداد')+'</small></div>'+
    '<div class="kpis">'+k+'</div>';
}

var TABS = [
  ['dashboard','Dashboard','ڈیش بورڈ'],['journal','Journal','روزنامچہ'],
  ['ledger','Ledger','کھاتہ'],['trial','Trial Balance','میزان'],
  ['income','Income Statement','آمدنی گوشوارہ'],['balance','Balance Sheet','بیلنس شیٹ'],
  ['accounts','Chart of Accounts','کھاتوں کی فہرست'],['rules','Accounting Rules','اکاؤنٹنگ اصول'],
  ['data','Data','ڈیٹا']
];
function tabsHTML(){
  var b = TABS.map(function(t){
    return '<button class="tab '+(state.tab===t[0]?'on':'')+'" data-action="tab" data-tab="'+t[0]+'">'+L(t[1],t[2])+'</button>';
  }).join('');
  return '<div class="tabs">'+b+'</div>';
}

function mainHTML(){
  if(state.tab === 'category') return categoryPanel();
  switch(state.tab){
    case 'journal':  return journalPanel();
    case 'ledger':   return ledgerPanel();
    case 'trial':    return trialPanel();
    case 'income':   return incomePanel();
    case 'balance':  return balancePanel();
    case 'accounts': return accountsPanel();
    case 'rules':    return rulesPanel();
    case 'data':     return dataPanel();
    default:         return dashboardPanel();
  }
}

function dashboardPanel(){
  var recent = state.entries.slice().sort(function(a,b){
    return (b.date||'').localeCompare(a.date||'') || (b.id - a.id);
  }).slice(0,5);
  var rows = recent.length
    ? recent.map(function(e){ return entryCard(e); }).join('')
    : '<div class="empty"><span class="big">✎</span>'+L('No transactions yet. Post your first journal entry below.','ابھی کوئی لین دین نہیں۔ نیچے پہلا اندراج درج کریں۔')+
      '<div class="cta"><button class="ghost" data-action="tab" data-tab="journal">'+L('Open Journal →','روزنامچہ کھولیں →')+'</button></div></div>';
  return '<div class="panel">'+
    '<div class="grid2">'+
      '<div class="card">'+
        '<h3 class="block-h">'+L('Quick Posting','فوری اندراج')+'</h3>'+
        '<p style="color:var(--muted);font-size:12.8px;line-height:1.8;margin-bottom:14px">'+
          L('Record every transaction with equal debit and credit.','ہر لین دین برابر ڈیبٹ اور کریڈٹ کے ساتھ درج کریں۔')+
        '</p>'+
        '<button class="primary" data-action="tab" data-tab="journal">+ '+L('New Journal Entry','نیا اندراج')+'</button>'+
        '<button class="ghost" style="width:100%;margin-top:9px" data-action="tab" data-tab="accounts">⚙ '+L('Manage Chart of Accounts','کھاتوں کی فہرست سنبھالیں')+'</button>'+
        '<div style="display:flex;gap:10px;margin-top:11px">'+
          '<button class="ghost" style="flex:1" data-action="tab" data-tab="trial">'+L('Trial Balance','میزان')+'</button>'+
          '<button class="ghost" style="flex:1" data-action="tab" data-tab="balance">'+L('Balance Sheet','بیلنس شیٹ')+'</button>'+
        '</div>'+
      '</div>'+
      '<div class="card">'+
        '<h3 class="block-h">'+L('Accounting Cycle','اکاؤنٹنگ چکر')+'</h3>'+
        '<div style="display:flex;flex-direction:column;gap:9px">'+
          [['1','Transaction','لین دین'],['2','Journal Entry','روزنامچہ'],['3','Post to Ledger','کھاتہ'],
           ['4','Trial Balance','میزان'],['5','Financial Statements','مالی گوشوارے']].map(function(s){
            return '<div style="display:flex;align-items:center;gap:11px;font-size:12.8px;color:#C7CBD1">'+
              '<span style="width:22px;height:22px;flex:0 0 auto;border-radius:7px;display:grid;place-items:center;background:rgba(59,130,246,.16);color:#93C5FD;font-size:10.5px;font-weight:800;border:1px solid rgba(59,130,246,.28)">'+s[0]+'</span>'+
              L(s[1],s[2])+'</div>';
          }).join('')+
        '</div>'+
      '</div>'+
    '</div>'+
    '<div class="sec-title"><h2>'+L('Recent Transactions','حالیہ لین دین')+'</h2><small>'+state.entries.length+' '+L('entries','اندراجات')+'</small></div>'+
    '<div class="card" style="padding:14px">'+rows+'</div>'+
  '</div>';
}

function categoryPanel(){
  var key = state.cat;
  var c = CATS[key];
  var net = netMap();
  var accs = state.accounts.filter(function(a){ return a.type === key; });
  var total = accs.reduce(function(s,a){ return s + balOf(a,net); }, 0);
  var rows = accs.length ? accs.map(function(a){
    var v = balOf(a,net);
    return '<tr><td><b style="color:#E5E7EB">'+esc(nm(a))+'</b><br><span style="font-size:10.5px;color:var(--muted)">#'+a.id+'</span></td>'+
      '<td class="num" style="color:'+(v<0?'#FDA4AF':'#E5E7EB')+';font-weight:700">'+fmt(v)+'</td>'+
      '<td style="width:74px;text-align:right">'+
        '<button class="icon-btn" data-action="editAccount" data-id="'+a.id+'" title="'+L('Edit','ترمیم')+'">✎</button>'+
        '<button class="icon-btn del" data-action="delAccount" data-id="'+a.id+'" title="'+L('Delete','حذف')+'">✕</button>'+
      '</td></tr>';

    '<div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap">'+

      '<button class="back-btn" style="margin-bottom:0;border-color:rgba(59,130,246,.5);color:#93C5FD" data-action="quickAddAccount" data-type="'+key+'">+ '+L('Add New','نیا شامل کریں')+'</button>'+
    '</div>'+
    '<div class="card" style="margin-bottom:14px">'+
      '<div style="display:flex;align-items:center;gap:12px;margin-bottom:10px">'+
        '<span class="pill '+key+'">'+L(c.en,c.ur)+'</span>'+
        '<span style="font-size:11px;color:var(--muted)">'+accs.length+' '+L('accounts','کھاتے')+'</span>'+
      '</div>'+
      '<p style="font-size:12.8px;line-height:1.85;color:var(--muted)">'+L(c.descEn,c.descUr)+'</p>'+
      '<div style="margin-top:14px;font-size:22px;font-weight:800;letter-spacing:-.5px" class="num">'+fmt(total)+'</div>'+
      '<div style="font-size:11px;color:var(--muted);margin-top:3px">'+L('Total balance','کل بیلنس')+'</div>'+
    '</div>'+
    '<div class="card">'+
      '<h3 class="block-h">'+L('Accounts in this section','اس حصے کے کھاتے')+'</h3>'+
      '<div class="tbl-wrap"><table class="tbl">'+
        '<thead><tr><th>'+L('Account','کھاتہ')+'</th><th class="num">'+L('Balance','بیلنس')+'</th><th></th></tr></thead>'+
        '<tbody>'+rows+'</tbody>'+
        '<tfoot><tr><td colspan="2">'+L('Total','کل')+'</td><td class="num">'+fmt(total)+'</td></tr></tfoot>'+
      '</table></div>'+
    '</div>'+
  '</div>';
}

function journalPanel(){
  var editing = state.editingEntry ? state.entries.filter(function(e){ return e.id === state.editingEntry; })[0] : null;
  var formTitle = editing ? L('Edit Journal Entry','اندراج میں ترمیم') : L('New Journal Entry (Double Entry)','نیا روزنامچہ (دوہرا اندراج)');
  var dateVal = editing ? editing.date : today();
  var descVal = editing ? esc(editing.desc) : '';
  var amtVal  = editing ? editing.lines[0].debit : '';
  var drVal   = editing ? editing.lines[0].accountId : '';
  var crVal   = editing ? editing.lines[1].accountId : '';
  var optsDr = state.accounts.map(function(a){
    return '<option value="'+a.id+'"'+(a.id===drVal?' selected':'')+'>'+esc(a.id)+' — '+esc(nm(a))+'</option>';
  }).join('');
  var optsCr = state.accounts.map(function(a){
    return '<option value="'+a.id+'"'+(a.id===crVal?' selected':'')+'>'+esc(a.id)+' — '+esc(nm(a))+'</option>';
  }).join('');
  var cancelBtn = editing ? '<button type="button" class="cancel" data-action="cancelEditEntry">'+L('Cancel','منسوخ')+'</button>' : '';
  var sorted = state.entries.slice().sort(function(a,b){
    return (b.date||'').localeCompare(a.date||'') || (b.id - a.id);
  });
  var list = sorted.length ? sorted.map(function(e){ return entryCard(e); }).join('')
    : '<div class="empty"><span class="big">📒</span>'+L('No entries yet. Add one above.','ابھی کوئی اندراج نہیں۔ اوپر شامل کریں۔')+'</div>';
  return '<div class="panel">'+
    '<div class="card" style="margin-bottom:14px">'+
      (editing ? '<div class="edit-badge">'+L('EDITING','ترمیم جاری')+'</div>' : '')+
      '<h3 class="block-h">'+formTitle+'</h3>'+
      '<form id="entryForm">'+
        '<input type="hidden" name="editId" value="'+(editing ? editing.id : '')+'">'+
        '<div class="row">'+
          '<div class="field"><label>'+L('Date','تاریخ')+'</label><input type="date" name="date" value="'+dateVal+'" required></div>'+
          '<div class="field"><label>'+L('Amount (Rs)','رقم (روپے)')+'</label><input type="number" name="amount" min="0.01" step="0.01" value="'+amtVal+'" placeholder="0.00" required></div>'+
        '</div>'+
        '<div class="field"><label>'+L('Description','تفصیل')+'</label><input type="text" name="desc" maxlength="140" value="'+descVal+'" placeholder="'+L('e.g. Cash sale of hosiery','مثلاً: ہوزری کی نقد فروخت')+'" required></div>'+
        '<div class="row">'+
          '<div class="field"><label>'+L('Debit Account (Dr)','ڈیبٹ کھاتہ')+'</label><select name="debit" required>'+optsDr+'</select></div>'+
          '<div class="field"><label>'+L('Credit Account (Cr)','کریڈٹ کھاتہ')+'</label><select name="credit" required>'+optsCr+'</select></div>'+
        '</div>'+
        '<button class="primary" type="submit">'+(editing ? L('SAVE CHANGES','ترمیم محفوظ کریں') : L('POST ENTRY','اندراج درج کریں'))+'</button>'+
        cancelBtn+
      '</form>'+
    '</div>'+
    '<div class="sec-title"><h2>'+L('Journal Book','روزنامچہ')+'</h2><small>'+state.entries.length+' '+L('entries','اندراجات')+'</small></div>'+
    '<div>'+list+'</div>'+
  '</div>';
}

function entryCard(e){
  var isEditing = (state.editingEntry === e.id);
  var lines = (e.lines||[]).map(function(l){
    var a = acc(l.accountId);
    var isDr = Number(l.debit) > 0;
    return '<div class="eline '+(isDr?'dr':'cr')+'">'+
      '<span>'+esc(a ? nm(a) : l.accountId)+'<span class="tag">'+(isDr?L('Dr','ڈیبٹ'):L('Cr','کریڈٹ'))+'</span></span>'+
      '<span class="amt">'+fmt(isDr ? l.debit : l.credit)+'</span></div>';
  }).join('');
  return '<div class="entry '+(isEditing?'editing':'')+'">'+
    '<div class="entry-head"><div style="min-width:0">'+
      '<div class="entry-desc">'+esc(e.desc)+'</div>'+
      '<div class="entry-date">'+fmtDate(e.date)+' · #'+e.id+'</div>'+
    '</div><div style="flex:0 0 auto;white-space:nowrap">'+
      '<button class="icon-btn" data-action="editEntry" data-id="'+e.id+'" title="'+L('Edit','ترمیم')+'">✎</button>'+
      '<button class="icon-btn del" data-action="delEntry" data-id="'+e.id+'" title="'+L('Delete','حذف')+'">✕</button>'+
    '</div></div>'+
    '<div class="entry-lines">'+lines+'</div>'+
  '</div>';
}

function ledgerPanel(){
  if(!state.accounts.length) return '<div class="panel"><div class="empty">'+L('No accounts.','کوئی کھاتہ نہیں۔')+'</div></div>';
  if(!acc(state.ledgerAcc)) state.ledgerAcc = state.accounts[0].id;
  var a = acc(state.ledgerAcc);
  var opts = state.accounts.map(function(x){
    return '<option value="'+x.id+'"'+(x.id===state.ledgerAcc?' selected':'')+'>'+esc(x.id)+' — '+esc(nm(x))+'</option>';
  }).join('');
  var items = [];
  state.entries.forEach(function(e){
    (e.lines||[]).forEach(function(l){
      if(l.accountId === state.ledgerAcc) items.push({e:e, l:l});
    });
  });
  items.sort(function(x,y){ return (x.e.date||'').localeCompare(y.e.date||'') || (x.e.id - y.e.id); });
  var run = 0, rows = '';
  items.forEach(function(it){
    var dr = Number(it.l.debit)||0, cr = Number(it.l.credit)||0;
    run += dr - cr;
    var nat = (a.n === 'D') ? run : -run;
    rows += '<tr><td>'+fmtDate(it.e.date)+'</td><td>'+esc(it.e.desc)+'</td>'+
      '<td class="num" style="color:#93C5FD">'+(dr ? fmt(dr) : '—')+'</td>'+
      '<td class="num" style="color:#6EE7B7">'+(cr ? fmt(cr) : '—')+'</td>'+
      '<td class="num" style="font-weight:700">'+fmt(nat)+'</td></tr>';
  });
  if(!rows) rows = '<tr><td colspan="5" style="text-align:center;color:var(--muted);padding:26px">'+L('No transactions in this account.','اس کھاتے میں کوئی لین دین نہیں۔')+'</td></tr>';
  var finalBal = (a.n === 'D') ? run : -run;
  return '<div class="panel">'+
    '<div class="card" style="margin-bottom:14px">'+
      '<h3 class="block-h">'+L('Ledger Account','کھاتہ')+'</h3>'+
      '<div class="field" style="margin-bottom:0"><label>'+L('Select Account','کھاتہ منتخب کریں')+'</label>'+

function trialPanel(){

function incomePanel(){

function saveEntry(fd){
  var editId = fd.get('editId');
  var date   = fd.get('date') || today();
  var desc   = String(fd.get('desc') || '').trim();
  var amount = Number(fd.get('amount'));
  var dr     = fd.get('debit');
  var cr     = fd.get('credit');
  if(!desc){ toast(L('Please enter a description','تفصیل درج کریں'), 'err'); return; }
  if(!amount || amount <= 0){ toast(L('Enter a valid amount','درست رقم درج کریں'), 'err'); return; }
  if(!dr || !cr){ toast(L('Select both accounts','دونوں کھاتے منتخب کریں'), 'err'); return; }
  if(dr === cr){ toast(L('Debit and credit must be different accounts','ڈیبٹ اور کریڈٹ کھاتے مختلف ہوں'), 'err'); return; }
  if(editId){
    var e = state.entries.filter(function(x){ return String(x.id) === String(editId); })[0];
    if(!e){ toast(L('Entry not found','اندراج نہیں ملا'), 'err'); return; }
    e.date = date; e.desc = desc;
    e.lines = [{accountId: dr, debit: amount, credit: 0},{accountId: cr, debit: 0, credit: amount}];
    state.editingEntry = null;
    render();
    toast(L('Entry updated ✓','اندراج اپ ڈیٹ ہو گیا ✓'), 'ok');
  } else {
    state.entries.push({id: state.nextId++, date: date, desc: desc,
      lines: [{accountId: dr, debit: amount, credit: 0},{accountId: cr, debit: 0, credit: amount}]});
    render();
    toast(L('Entry posted ✓','اندراج درج ہو گیا ✓'), 'ok');
  }
}

function saveAccount(fd){
  var editCode = fd.get('editCode');
  var code = String(fd.get('code') || '').trim();
  var type = fd.get('type');
  var en   = String(fd.get('nameEn') || '').trim();
  var ur   = String(fd.get('nameUr') || '').trim();
  if(!code || !en || !ur){ toast(L('Fill all fields','تمام خانے بھریں'), 'err'); return; }
  if(!CATS[type]){ toast(L('Invalid category','غلط زمرہ'), 'err'); return; }
  if(editCode){
    var a = acc(editCode);
    if(!a){ toast(L('Account not found','کھاتہ نہیں ملا'), 'err'); return; }
    a.type = type; a.en = en; a.ur = ur;
    a.n = (type === 'asset' || type === 'expense') ? 'D' : 'C';
    state.editingAccount = null;
    state.newAccountType = null;
    render();
    toast(L('Account updated ✓','کھاتہ اپ ڈیٹ ہو گیا ✓'), 'ok');
  } else {
    for(var i=0;i<state.accounts.length;i++){
      if(state.accounts[i].id === code){ toast(L('Code already exists','یہ نمبر پہلے سے موجود ہے'), 'err'); return; }
    }
    state.accounts.push({id: code, en: en, ur: ur, type: type,
      n: (type === 'asset' || type === 'expense') ? 'D' : 'C'});
    state.newAccountType = null;
    render();
    toast(L('Account added ✓','کھاتہ شامل ہو گیا ✓'), 'ok');
  }
}

function editAccount(id){
  if(!acc(id)) return;
  state.editingAccount = id;
  state.tab = 'accounts';
  render();
  window.scrollTo({top:0, behavior:'smooth'});
}

function quickAddAccount(type){
  state.tab = 'accounts';
  state.newAccountType = type;
  state.editingAccount = null;
  render();
  window.scrollTo({top:0, behavior:'smooth'});
}

function editEntry(id){
  var found = state.entries.filter(function(x){ return x.id === id; })[0];
  if(!found) return;
  state.editingEntry = id;
  state.tab = 'journal';
  render();
  window.scrollTo({top:0, behavior:'smooth'});
}

function deleteEntry(id){
  if(!confirm(L('Delete this journal entry?','کیا یہ اندراج حذف کریں؟'))) return;
  state.entries = state.entries.filter(function(e){ return e.id !== id; });
  if(state.editingEntry === id) state.editingEntry = null;
  render();
  toast(L('Entry deleted','اندراج حذف ہو گیا'), 'ok');
}

function deleteAccount(id){
  var used = false;
  for(var i=0;i<state.entries.length;i++){
    var lines = state.entries[i].lines || [];
    for(var j=0;j<lines.length;j++){
      if(lines[j].accountId === id){ used = true; break; }
    }
    if(used) break;
  }
  if(used){ toast(L('Cannot delete — account has transactions','حذف نہیں ہو سکتا — لین دین موجود ہے'), 'err'); return; }
  if(!confirm(L('Delete this account?','کیا یہ کھاتہ حذف کریں؟'))) return;
  state.accounts = state.accounts.filter(function(a){ return a.id !== id; });
  if(state.editingAccount === id) state.editingAccount = null;
  render();
  toast(L('Account deleted','کھاتہ حذف ہو گیا'), 'ok');
}

function exportBackup(){
  var data = JSON.stringify({app:'MI Hosiery', owner:'Muhammad Zahid',
    exported: new Date().toISOString(), accounts: state.accounts, entries: state.entries, nextId: state.nextId}, null, 2);
  var blob = new Blob([data], {type: 'application/json'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'MI-Hosiery-Backup-' + today() + '.json';
  a.click();
  URL.revokeObjectURL(a.href);
  toast(L('Backup exported ✓','بیک اپ نکال دیا گیا ✓'), 'ok');
}

function importBackup(file){
  var r = new FileReader();
  r.onload = function(){
    try{
      var d = JSON.parse(r.result);
      if(!Array.isArray(d.accounts) || !Array.isArray(d.entries)) throw new Error('bad');
      state.accounts = d.accounts;
      state.entries  = d.entries;
      state.nextId   = d.nextId || (Math.max.apply(null, [0].concat(d.entries.map(function(e){ return e.id; }))) + 1);
      state.editingAccount = null;
      state.editingEntry = null;
      state.newAccountType = null;
      render();
      toast(L('Backup restored ✓','بیک اپ بحال ہو گیا ✓'), 'ok');
    }catch(err){
      toast(L('Invalid backup file','بیک اپ فائل درست نہیں'), 'err');
    }
  };
  r.readAsText(file);
}

function bind(){
  var ef = document.getElementById('entryForm');
  if(ef) ef.addEventListener('submit', function(e){ e.preventDefault(); saveEntry(new FormData(ef)); });
  var af = document.getElementById('acctForm');
  if(af) af.addEventListener('submit', function(e){ e.preventDefault(); saveAccount(new FormData(af)); });
  var ls = document.getElementById('ledgerSel');
  if(ls) ls.addEventListener('change', function(){ state.ledgerAcc = ls.value; render(); });
  var fi = document.getElementById('importFile');
  if(fi) fi.addEventListener('change', function(){ if(fi.files[0]) importBackup(fi.files[0]); });
}

document.addEventListener('click', function(e){
  try{
    var btn = e.target.closest('[data-action]');
    if(!btn) return;
    var a = btn.getAttribute('data-action');
    if(a === 'setLang'){ if(btn.dataset.lang !== state.lang){ state.lang = btn.dataset.lang; render(); } return; }
    if(a === 'tab'){ state.tab = btn.dataset.tab; state.editingAccount = null; state.editingEntry = null; state.newAccountType = null; render(); window.scrollTo({top:0, behavior:'smooth'}); return; }
    if(a === 'openCat'){ state.cat = btn.dataset.cat; state.tab = 'category'; render(); window.scrollTo({top:0, behavior:'smooth'}); return; }
    if(a === 'editAccount'){ editAccount(btn.dataset.id); return; }
    if(a === 'cancelEditAccount'){ state.editingAccount = null; state.newAccountType = null; render(); return; }
    if(a === 'quickAddAccount'){ quickAddAccount(btn.dataset.type); return; }
    if(a === 'editEntry'){ editEntry(Number(btn.dataset.id)); return; }
    if(a === 'cancelEditEntry'){ state.editingEntry = null; render(); return; }
    if(a === 'delEntry'){ deleteEntry(Number(btn.dataset.id)); return; }
    if(a === 'delAccount'){ deleteAccount(btn.dataset.id); return; }
    if(a === 'export'){ exportBackup(); return; }
    if(a === 'import'){ var f = document.getElementById('importFile'); if(f) f.click(); return; }
    if(a === 'clearAll'){
      if(!confirm(L('Delete ALL journal entries? Accounts will be kept.','تمام اندراجات حذف کریں؟ کھاتے رہیں گے۔'))) return;
      state.entries = []; state.nextId = 1; state.editingEntry = null; render();
      toast(L('All entries cleared','تمام اندراجات حذف ہو گئے'), 'ok');
      return;
    }
    if(a === 'resetAll'){
      if(!confirm(L('FACTORY RESET: delete all entries AND reset accounts?','فیکٹری ری سیٹ: تمام اندراجات اور کھاتے ری سیٹ؟'))) return;
      state.accounts = JSON.parse(JSON.stringify(DEFAULT_ACCOUNTS));
      state.entries = []; state.nextId = 1; state.ledgerAcc = '1000';
      state.editingAccount = null; state.editingEntry = null; state.newAccountType = null;
      render();
      toast(L('Everything reset to factory defaults','سب کچھ ری سیٹ ہو گیا'), 'ok');
      return;
    }
  }catch(err){
    console.error('Click handler error:', err);
    toast('Error: ' + err.message, 'err');
  }
});

(function boot(){
  var loaded = load();
  if(!loaded){
    state.accounts = JSON.parse(JSON.stringify(DEFAULT_ACCOUNTS));
    state.entries  = [];
    state.nextId   = 1;
    state.ledgerAcc = '1000';
  }
  if(!state.accounts.length) state.accounts = JSON.parse(JSON.stringify(DEFAULT_ACCOUNTS));
  if(!state.ledgerAcc || !acc(state.ledgerAcc)) state.ledgerAcc = state.accounts[0].id;
  state.tab = 'dashboard';
  render();
})();
</script>

    });
  });
